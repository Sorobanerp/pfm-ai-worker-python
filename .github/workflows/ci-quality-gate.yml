name: CI Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, "release/**", main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-sast:
    name: Gitleaks + Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets/PII)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config auto --error

  test-and-sonar:
    name: Testes (cobertura >= 95%) + SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e . pytest pytest-cov ruff
      - name: Lint
        run: ruff check src tests
      - name: Testes com cobertura >= 95%
        run: pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=95
      - name: SonarCloud (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-scan:
    name: Imagem Distroless + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker (Distroless)
        run: docker build -t pfm/pfm-ai-worker-python:${{ github.sha }} .
      - name: Trivy (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: pfm/pfm-ai-worker-python:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
